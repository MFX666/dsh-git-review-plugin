# Bundle layer for dsh-git-review-plugin. Referenced by package.json
# `dsh.bundle.patch`; applied when a profile lists this package.
#
# Adds one Host row: the git-review service (diff / commit / log / blame /
# compare / push over any checkout path) and its agent tools, plus the web
# UI review tab.
- insert:
    - id: git-review
      name: dsh-git-review-plugin
      config: {}
